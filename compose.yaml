# docker compose up --build   ->   http://localhost:8080
services:
  portfolio:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    image: satish-kohale-portfolio:latest
    ports:
      - "8080:8080"
    environment:
      # Set to 1 when a TLS-terminating proxy sits in front of the container.
      HTTPS_HEADERS: ${HTTPS_HEADERS:-0}
    # Hardening: the server only reads files and needs no privileges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
